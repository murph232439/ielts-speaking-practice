/* V3: 保留原网站蓝灰配色与搜索入口 */
:root{--ink:#1f2430;--muted:#66758e;--green:#2456a6;--green2:#356bb8;--sage:#eef3fb;--mint:#f7f9fc;--line:#dfe4ec;--cream:#f5f6f8;--white:#fff;--purple:#eee8fa}
.brand .logo,.nav button.active,.nav button:hover,.btn.primary{background:#2456a6!important}
.home-hero{background:linear-gradient(120deg,#2456a6,#376bb8)}
.canvas{background-color:#f7f9fc;background-image:radial-gradient(#cbd6e5 .9px,transparent .9px)}
.story-core{background:radial-gradient(circle at 33% 30%,#fcfdff,#e4ecfa);border-color:#bbcae9}
.story-node.selected{border-color:#8daee3}
.pill,.vocab-chip,.tip{background:#eef3fb;color:#2456a6}
.practice-search{padding:17px 22px;margin:14px 0 20px}
.search-entry{margin-top:13px}
.search-results{display:grid;gap:7px;margin-top:10px;max-height:340px;overflow:auto}
.search-item{display:flex;align-items:center;justify-content:space-between;text-align:left;gap:15px;border:1px solid #e2e8f2;background:#fff;border-radius:10px;padding:10px 14px;color:#1f2430;cursor:pointer;width:100%}
.search-item:hover{border-color:#8facd6;background:#f7faff}
.search-item strong{font-size:13px;display:block;margin-bottom:4px}
.search-item small{display:block;color:#77859c;font-size:11px;max-width:570px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.search-item .pill{flex:0 0 auto}

/* V3 真实自由画布：气泡、题卡可以各自移动，连线自动跟随 */
.story-layout{grid-template-columns:240px minmax(0,1fr) 310px;gap:14px}
.story-tools{margin:-8px 0 14px;justify-content:flex-end}
.topic-bank,.story-detail{height:calc(100vh - 235px);min-height:650px}
.canvas{height:calc(100vh - 235px);min-height:650px}
.canvas-toolbar{min-height:56px;gap:10px}
.canvas-toolbar .tabs{flex-shrink:0}
.canvas-toolbar .tab{padding:8px 10px}
.canvas-scroll{overflow:auto;cursor:grab;position:relative}
.canvas-scroll:active{cursor:grabbing}
.canvas-inner{position:relative!important;display:block!important;min-width:0!important;gap:0!important;padding:0!important;transform-origin:0 0;background-color:transparent}
.canvas-zoom-shell{position:relative}
.story-connectors{position:absolute;inset:0;pointer-events:none;overflow:visible}
.story-connectors path{stroke:#a3bce0;stroke-width:2;fill:none;stroke-dasharray:7 6;opacity:.88}
.board-bubble,.board-topic{position:absolute;touch-action:none;user-select:none;cursor:grab;transition:box-shadow .15s;box-sizing:border-box}
.board-bubble{width:180px;height:180px;border-radius:50%;border:2px solid #b6caea;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;gap:7px;color:#264b8e;box-shadow:0 8px 25px rgba(53,88,145,.06)}
.board-bubble:hover,.board-bubble.picked{border-color:#2456a6;box-shadow:0 10px 28px #2456a62b}
.board-bubble.dragover{outline:4px solid #95b6eb;outline-offset:4px}
.board-bubble small{font-size:10px;letter-spacing:.15em;color:#7087b0}
.board-bubble strong{font-size:17px;line-height:1.38;max-width:145px;max-height:82px;overflow:hidden}
.board-bubble span{font-size:11px}
.board-bubble .bubble-hint{font-size:9px;color:#8796ad}
.board-bubble.tone-blue{background:radial-gradient(circle at 35% 35%,#fff,#e7f0ff)}
.board-bubble.tone-lavender{background:radial-gradient(circle at 35% 35%,#fff,#efe8fa);border-color:#cbb8ea}
.board-bubble.tone-sand{background:radial-gradient(circle at 35% 35%,#fff,#fff0e4);border-color:#e7cdbc}

.board-topic{width:190px;min-height:65px;max-height:83px;border:1px solid #d3dfe9;border-radius:13px;background:white;box-shadow:0 4px 14px rgba(57,84,126,.07);padding:10px 13px;overflow:hidden;display:flex;flex-direction:column;gap:5px}

.board-topic strong{font-size:12px;line-height:1.45;color:#34445f}
.board-topic:hover,.board-topic.picked{border-color:#7b9ed4;box-shadow:0 7px 19px #2456a626}
.board-topic:active,.board-bubble:active{cursor:grabbing}
.board-topic.dragging,.board-bubble.dragging{z-index:100;box-shadow:0 11px 28px #2456a633}
.topic-bank .field{margin:0}
.tone-options{display:flex;gap:9px}
.tone-option{height:25px;width:25px;border-radius:50%;border:1px solid #c7d3df;cursor:pointer}

.tone-option.tone-blue{background:#dce9ff}.tone-option.tone-lavender{background:#eee3fa}.tone-option.tone-sand{background:#f9e8d8}.tone-option.tone-mint{background:#dceee2}

.idea-input{min-height:86px!important}
.story-list-view{padding:18px;overflow:auto;height:100%;display:grid;align-content:start;gap:12px}
.story-list-card{border:1px solid #dce4ef;background:#fff;border-radius:15px;padding:18px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}
.story-list-card:hover,.story-list-card.selected{border-color:#8eade1;background:#f7faff}
.story-list-card h3{margin:6px 0;color:#2456a6}
.story-list-card small,.story-list-card span{font-size:11px;color:#72809a;line-height:1.6}

ing?","zh":"你有收集东西的习惯吗？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602410/ae4ecf342ea54437ab4d49c8e06a144e.mp3"},{"t":"Are there any things you keep from childhood?","zh":"有从童年保存下来的东西吗？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602410/ff62a2f580bf4f52ad0d98c07734e561.mp3"},{"t":"Where do you usually keep things you collect?","zh":"你通常把收集的东西放在哪里？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602410/baaf5a30e1f2417d9b7d4d4aac74ba19.mp3"}]},{"id":"g9","part":"p1","cat":"当季新题","title":"Computers","cue":"","audio":"","lines":[{"t":"In what conditions would you use a computer?","zh":"什么情况下你会用电脑？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602743/dc546ff57119411999956c5129b48a0d.mp3"},{"t":"When was the first time you used a computer?","zh":"你第一次用电脑是什么时候？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602743/c63c46b47c61479ea6bb1632337d5e34.mp3"},{"t":"What will your life be like without computers?","zh":"没有电脑，你的生活会是什么样？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602743/a5c2a35a6ec446468e7ee9287bb8dd88.mp3"},{"t":"In what conditions would it be difficult for you to use a computer?","zh":"什么情况下你使用电脑会不方便？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2602000-2603000/2602743/bff30750370e4f29a3fb5bea991b8fd7.mp3"}]},{"id":"g10","part":"p1","cat":"当季新题","title":"Growing vegetables","cue":"","audio":"","lines":[{"t":"Is growing vegetables popular in your country?","zh":"在你们国家种菜流行吗？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2676000-2677000/2676877/af6952505281494d8ce67b19fa9c5328.mp3"},{"t":"Do many people grow vegetables in your city?","zh":"你所在的城市有很多人种菜吗？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2676000-2677000/2676877/0c2c03bfcdc4462a97b51873e1c1a3d9.mp3"},{"t":"Do you think it's easy to grow vegetables?","zh":"你觉得种菜容易吗？","a":"https://daxue-oss.koocdn.com/upload/ti/sardine/2676000-2677000/267687 function cueArray(cue){if(!cue)return[];var parts=cue.replace(/\r/g,'').split(/you should say\s*:?/i);var tail=parts.length>1?parts.slice(1).join(' '):cue;return tail.split(/\n/).map(function(x){return x.trim().replace(/^[-•\d.)\s]+/,'').trim()}).filter(function(x){return x.length>3&&!/^you should|^you will have|^you have one minute/i.test(x)}).slice(0,7)}

 });
 });

function ensureLayout(s,i){

 (s.topics||[]).forEach(function(t,n){

function startRecord(){if(!navigator.mediaDevices||!window.MediaRecorder){alert('当前浏览器不支持麦克风录音。请使用 Chrome 或新版 Safari，在HTTPS页面打开。');return}stopRecord(true);navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){rec.stream=stream;rec.parts=[];rec.media=new MediaRecorder(stream);rec.media.ondataavailable=function(e){if(e.data.size)rec.parts.push(e.data)};rec.media.onstop=function(){var blob=new Blob(rec.parts,{type:rec.media.mimeType||'audio/webm'});if(rec.url)URL.revokeObjectURL(rec.url);rec.url=URL.createObjectURL(blob);var box=document.getElementById('record-playback');if(box)box.innerHTML='<audio controls src="'+rec.url+'" style="width:100%"></audio><p class="muted">此录音尚未上传，关闭或切换页面后可能丢失。</p>';if(rec.stream)rec.stream.getTracks().forEach(function(t){t.stop()});rec.stream=null};rec.media.start(250);rec.start=Date.now();var status=document.getElementById('record-status');if(status)status.textContent='● 录音中';var b=document.getElementById('record-btn'),s=document.getElementById('record-stop');if(b)b.disabled=true;if(s)s.disabled=false;rec.timer=setInterval(function(){var seconds=Math.floor((Date.now()-rec.start)/1000);var clock=document.getElementById('clock');if(clock)clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},250)}).catch(function(){alert('无法使用麦克风，请检查浏览器权限。')})}
function stopRecord(silent){clearInterval(rec.timer);rec.timer=null;if(rec.media&&rec.media.state==='recording'){if(silent){rec.media.onstop=null;if(rec.stream)rec.stream.getTracks().forEach(function(t){t.stop()});rec.stream=null}else rec.media.stop()}var b=document.getElementById('record-btn'),s=document.getElementById('record-stop'),status=document.getElementById('record-status');if(b)b.disabled=false;if(s)s.disabled=true;if(status)status.textContent='● 录音结束';if(silent&&rec.url){URL.revokeObjectURL(rec.url);rec.url=null}}
var audioPlayer=null;
document.addEventListener('click',function(e){
var el=e.target.closest('[data-page],[data-go],[data-part],[data-search-mode],[data-select-topic],[data-guide],[data-action],[data-add-topic],[data-select-story],[data-inspect-topic],[data-remove-topic],[data-story-view],[data-tint]');
if(!el)return;
if(el.dataset.page){go(el.dataset.page);return}
if(el.dataset.go){go(el.dataset.go);return}
if(el.dataset.part){stopRecord(true);state.part=el.dataset.part;state.lineIdx[state.part]=0;state.guide='ideas';state.showQuestion=true;render();return}
if(el.dataset.searchMode){state.searchMode=el.dataset.searchMode;render();return}
if(el.dataset.selectTopic!==undefined){var chosen=Number(el.dataset.selectTopic);if(Number.isFinite(chosen)&&chosen>=0){state.idx[state.part]=chosen;state.lineIdx[state.part]=Number(el.dataset.selectLine)||0;state.searchMode='practice';state.practiceSearch='';state.showQuestion=true;stopRecord(true);render();}return}
if(el.dataset.guide){state.guide=el.dataset.guide;render();return}
if(el.dataset.storyView){state.storyView=el.dataset.storyView;render();return}
if(el.dataset.tint){var tintStory=selected();if(tintStory){checkpoint();tintStory.tint=el.dataset.tint;save();render()}return}
if(el.dataset.selectStory){if(Date.now()<ignoreNodeClickUntil)return;selectBoardStory(el.dataset.selectStory,el.dataset.inspectTopic||null);return}
if(el.dataset.addTopic){topicAdd(el.dataset.addTopic);return}
if(el.dataset.removeTopic){var s=selected();if(s){checkpoint();s.topics=s.topics.filter(function(id){return id!==el.dataset.removeTopic});delete s.checks[el.dataset.removeTopic];if(s.positions)delete s.positions[el.dataset.removeTopic];if(s.topicIdeas)delete s.topicIdeas[el.dataset.removeTopic];save();render()}return}
var a=el.dataset.action;
if(a==='undo'){historyMove('undo');return}
if(a==='redo'){historyMove('redo');return}
if(a==='export-data'){exportStories();return}
if(a==='import-data'){document.getElementById('story-import-file').click();return}
if(a==='new-story'){document.getElementById('storyDialog').showModal();return}
if(a==='delete-story'){var s=selected();if(s&&confirm('确认删除「'+s.title+'」？只删除此故事，不影响题库。')){checkpoint();db.stories=db.stories.filter(function(x){return x.id!==s.id});db.selectedStory=db.stories.length?db.stories[0].id:null;save();render()}return}
if(a==='zoom-in'){state.zoom=Math.min(1.5,Math.round((state.zoom+.1)*10)/10);render();return}
if(a==='zoom-out'){state.zoom=Math.max(.35,Math.round((state.zoom-.1)*10)/10);render();return}
if(a==='zoom-reset'){var area=document.getElementById('canvas-scroll');var available=area?area.clientWidth:900;state.zoom=Math.max(.35,Math.min(1,Math.round((available-34)/BOARD_W*100)/100));render();return}
if(a==='toggle-question'){state.showQuestion=!state.showQuestion;render();return}
if(a==='next'||a==='prev'){stopRecord(true);var groups=BANK.filter(function(x){return x.part===state.part}),group=getGroup(),lines=state.part==='p2'?1:((group.lines||[]).length||1);if(a==='next'&&state.lineIdx[state.part]<lines-1){state.lineIdx[state.part]++}else if(a==='prev'&&state.lineIdx[state.part]>0){state.lineIdx[state.part]--}else{state.idx[state.part]=(state.idx[state.part]+(a==='next'?1:-1)+groups.length)%groups.length;var newGroup=getGroup();state.lineIdx[state.part]=a==='prev'&&state.part!=='p2'?Math.max(0,((newGroup.lines||[]).length||1)-1):0}state.showQuestion=true;render();return}
if(a==='play-audio'){var url=getAudio();if(!url){alert('这道题暂时没有可播放的音频。');return}if(audioPlayer)audioPlayer.pause();audioPlayer=new Audio(url);audioPlayer.play().catch(function(){alert('播放失败，请检查网络或原音频链接。')});return}
if(a==='start-record'){startRecord();return}
if(a==='stop-record'){stopRecord(false);return}
if(a==='mark-done'){var k=getQkey();db.done[k]=!db.done[k];save();render();return}
});
document.addEventListener('input',function(e){
if(e.target.id==='practice-search'){state.practiceSearch=e.target.value;var results=document.getElementById('practice-results');if(results){results.innerHTML=practiceSearchResults();results.hidden=!state.practiceSearch&&state.searchMode!=='browse'}return}
if(e.target.id==='practice-note'){db.notes[getQkey()]=e.target.value;save();return}
if(e.target.dataset.topicIdea){var detailStory=selected();if(detailStory){if(!detailStory.topicIdeas)detailStory.topicIdeas={};detailStory.topicIdeas[e.target.dataset.topicIdea]=e.target.value;save()}return}
if(e.target.id==='topic-search'){state.topicSearch=e.target.value;var list=document.getElementById('topic-list');if(list)list.innerHTML=bankList();return}
if(e.target.dataset.storyField){var s=selected();if(!s)return;s[e.target.dataset.storyField]=e.target.value;save();if(e.target.dataset.storyField==='title'){document.querySelectorAll('.board-bubble strong').forEach(function(el){var core=el.closest('[data-story-drop]');if(core&&core.dataset.storyDrop===s.id)el.textContent=s.title})}}
});
document.addEventListener('focusin',function(e){if(e.target.closest('.story-detail')&&(e.target.matches('textarea')||e.target.matches('input')||e.target.matches('select')))checkpoint()});
document.addEventListener('change',function(e){if(e.target.id==='topic-category'){state.topicCategory=e.target.value;render();return}if(e.target.id==='story-import-file'){importStories(e.target.files[0]);return}if(e.target.dataset.cueId){var s=selected(),id=e.target.dataset.cueId,i=Number(e.target.dataset.cueIdx);if(!s)return;if(!s.checks)s.checks={};if(!s.checks[id])s.checks[id]=[];s.checks[id]=s.checks[id].filter(function(x){return x!==i});if(e.target.checked)s.checks[id].push(i);save();var summary=e.target.closest('details').querySelector('summary span');if(summary)summary.textContent=s.checks[id].length+'/'+cueArray((P2.find(function(x){return x.id===id})||{}).cue).length}});
document.addEventListener('dragstart',function(e){var item=e.target.closest('[data-drag-topic]');if(item&&e.dataTransfer){e.dataTransfer.setData('text/plain',item.dataset.dragTopic);e.dataTransfer.effectAllowed='copy'}});

document.addEventListener('dragover',function(e){
 var drop=e.target.closest('[data-story-drop],#canvas-inner');
 if(drop){e.preventDefault();var bubble=e.target.closest('[data-story-drop]');if(bubble&&bubble.classList.contains('board-bubble'))bubble.classList.add('dragover')}
});
document.addEventListener('dragleave',function(e){var node=e.target.closest('.board-bubble');if(node&&!node.contains(e.relatedTarget))node.classList.remove('dragover')});
document.addEventListener('drop',function(e){
 var node=e.target.closest('[data-story-drop],#canvas-inner');if(!node)return;
 e.preventDefault();document.querySelectorAll('.board-bubble.dragover').forEach(function(x){x.classList.remove('dragover')});
 var id=e.dataTransfer.getData('text/plain');if(!P2.some(function(x){return x.id===id}))return;
 var bubble=e.target.closest('[data-story-drop]');
 if(bubble){topicAdd(id,bubble.dataset.storyDrop);return}
 if(!selected()){alert('请先创建一个故事。');return}
 topicAdd(id,db.selectedStory,boardCoords(e));
});
document.addEventListener('pointerdown',function(e){
 if(e.button!==0)return;
 var node=e.target.closest('[data-move-kind]');
 if(node&&state.storyView==='canvas'){
  var s=db.stories.find(function(x){return x.id===node.dataset.sid});if(!s)return;
  var tid=node.dataset.moveKind==='topic'?node.dataset.tid:null,p=tid?s.positions[tid]:s.layout;
  if(!p)return;
  boardDrag={kind:tid?'topic':'story',sid:s.id,tid:tid,startX:p.x,startY:p.y,clientX:e.clientX,clientY:e.clientY,node:node,moved:false};
  node.setPointerCapture(e.pointerId);return;
 }
 var scroll=e.target.closest('#canvas-scroll');
 if(scroll&&!e.target.closest('button,input,textarea')){
  boardDrag={kind:'pan',node:scroll,clientX:e.clientX,clientY:e.clientY,scrollX:scroll.scrollLeft,scrollY:scroll.scrollTop,moved:false};
  scroll.setPointerCapture(e.pointerId);
 }
});
document.addEventListener('pointermove',function(e){
 if(!boardDrag)return;
 var d=boardDrag,dx=e.clientX-d.clientX,dy=e.clientY-d.clientY;
 if(Math.abs(dx)+Math.abs(dy)>5)d.moved=true;
 if(d.kind==='pan'){
  d.node.scrollLeft=d.scrollX-dx;d.node.scrollTop=d.scrollY-dy;return;
 }
 if(!d.moved)return;
 if(!d.checkpointed){checkpoint();d.checkpointed=true}
 var s=db.stories.find(function(x){return x.id===d.sid});if(!s)return;
 var p=d.kind==='story'?s.layout:s.positions[d.tid];
 p.x=Math.max(4,Math.min(BOARD_W-(d.kind==='story'?184:194),Math.round(d.startX+dx/state.zoom)));
 p.y=Math.max(4,Math.min(BOARD_H-(d.kind==='story'?184:80),Math.round(d.startY+dy/state.zoom)));
 d.node.style.left=p.x+'px';d.node.style.top=p.y+'px';d.node.classList.add('dragging');updateCanvasLines();
});
document.addEventListener('pointerup',function(e){
 if(!boardDrag)return;var d=boardDrag;boardDrag=null;
 if(d.moved){
  ignoreNodeClickUntil=Date.now()+240;
  if(d.kind!=='pan'){save();d.node.classList.remove('dragging')}
 }
});
document.addEventListener('pointercancel',function(){if(boardDrag){save();boardDrag=null}});
document.getElementById('newStoryForm').addEventListener('submit',function(e){e.preventDefault();var name=document.getElementById('story-title').value.trim();if(!name)return;var kind=document.getElementById('story-kind').value;checkpoint();var s={id:'s'+Date.now(),title:name,kind:kind,notes:'',outline:'',chunks:'',topics:[],checks:{},positions:{},topicIdeas:{},tint:'blue'};db.stories.push(s);ensureLayout(s,db.stories.length-1);db.selectedStory=s.id;save();document.getElementById('storyDialog').close();e.target.reset();go('stories')});
document.getElementById('cancelStory').addEventListener('click',function(){document.getElementById('storyDialog').close()});
render();
})();
