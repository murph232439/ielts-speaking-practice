<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>录音发送回执</title><style>body{font:15px/1.8 system-ui,sans-serif;background:#faf7fc;color:#503565;padding:22px}h1{font-size:19px}</style></head><body><h1 id="heading">录音发送回执</h1><p id="message">请回到录音练习页查看发送状态。邮箱投递仍需老师确认。</p><script>
(function(){'use strict';var token=new URLSearchParams(location.search).get('receipt');if(!token||!/^[a-f0-9]{32}$/.test(token)){document.getElementById('message').textContent='这不是有效的提交回执，请返回原录音页查看状态。';return;}if(window.parent===window){document.getElementById('message').textContent='请回到发起提交的原录音页核对状态；单独打开此页不代表录音已发送。';return;}document.getElementById('heading').textContent='发送服务已返回回执';window.parent.postMessage({type:'ielts-speaking-service-receipt',token:token},location.origin);})();
</script></body></html>
