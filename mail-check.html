<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业提交检查</title><style>body{font:16px/1.8 system-ui,sans-serif;background:#f6f2fa;color:#44374f;margin:0;padding:28px 16px}main{max-width:680px;margin:auto;border:1px solid #e4d9ee;background:white;border-radius:18px;padding:28px}h1{font-size:25px}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#765c92;color:white;margin:8px 8px 8px 0;cursor:pointer}button:disabled{opacity:.5}a{color:#70538e}#srecstatus{padding:16px;background:#f4eff8;border-radius:10px;overflow-wrap:anywhere}small{color:#81718d}</style></head><body><main><h1>作业提交检查</h1><p>测试新的“录音和逐字稿作为邮件附件发送到 wuxi2@xdf.cn”链路。</p><p>点击后会提交一段无声测试音频，姓名固定为“系统链路测试（可忽略）”，不需要开麦克风，不使用学生作业。</p><button id="srecsubmit" onclick="submitSpeakingRecord()">提交无声测试录音</button><button id="srecdownload" onclick="IELTSRecordingDelivery.downloadCurrent()">下载测试录音</button><p id="srecstatus" role="status">尚未提交。只有邮件服务确认接受发送请求，才显示“邮件服务已接受”；是否实际送达仍须查收邮箱。</p><div id="srecresult" hidden></div><p><a href="./index.html">返回练习首页</a></p><small>收件地址：wuxi2@xdf.cn。仅邮件服务接受发送请求不代表已投递到收件箱，请检查收件箱及垃圾邮件。</small></main><script>
