<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雅思口语 · 逐题扣题素材</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#24364a;font:15px/1.7 system-ui,-apple-system,sans-serif}header{background:white;border-bottom:1px solid #dce3ec;padding:24px 20px;position:sticky;top:0;z-index:2}header>div,main{max-width:1000px;margin:auto}h1{margin:0;font-size:24px;color:#2456a6}header p{margin:5px 0 12px;font-size:13px;color:#526277}a{color:#2456a6}input{width:100%;font:inherit;border:1px solid #a9bcd5;border-radius:9px;padding:10px 12px;margin:12px 0}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #a9bcd5;border-radius:22px;padding:5px 15px;background:white;color:#34516f}button.active{background:#2456a6;color:white;border-color:#2456a6}button:focus-visible,input:focus-visible{outline:3px solid #76a7e1;outline-offset:2px}#cnt{font-size:12px;color:#526277}main{padding:16px 20px 40px}.cat{font-size:13px;color:#526277;margin:15px 0 6px}.card{background:white;border:1px solid #e1e7ee;border-radius:12px;margin:12px 0;padding:16px}.ptitle{font-weight:700;color:#2456a6;margin-bottom:10px}.cue{white-space:pre-line;padding:10px 12px;background:#fafbfd;border-radius:8px;font-size:14px}.qrow{padding:12px 0 5px;border-top:1px solid #edf0f5}.qtxt{font-weight:600;font-size:14px}.zhs{font-size:13px;color:#526277;font-weight:400}.empty{padding:24px;text-align:center;color:#526277}@media(max-width:650px){header{position:static;padding:18px 14px}main{padding:10px 12px 30px}.card{padding:12px}h1{font-size:22px}}
</style></head>
<body><header><div><h1>雅思口语 · 逐题扣题素材</h1><p>66 张 Part 2 题卡 · 272 道 Part 3 问题 · 中文思路与 B1 / B2 / C1 表达</p><a href="./">返回题库与听音练习</a><label for="q"><input id="q" type="search" placeholder="搜索题目或素材，例如 advertisement、弹窗、环保、学校规则" aria-label="搜索题目或素材"></label><nav aria-label="筛选题型"><button class="active" data-part="p2" aria-pressed="true">Part 2</button><button data-part="p3" aria-pressed="false">Part 3</button><button data-part="all" aria-pressed="false">全部素材</button><span id="cnt" role="status"></span></nav></div></header><main id="list">正在载入逐题素材…</main>
<script src="question-materials-1.js?v=20261009a"></script><script src="question-materials-2.js?v=20261009a"></script><script src="question-materials-3.js?v=20261009a"></script><script src="question-materials-4.js?v=20261009a"></script>
<script>
var MODE='browse', PART='p2', KW='', G=[], materials=(window.IELTSQuestionMaterialChunks||[]).flat();
var groupMap=new Map();
materials.forEach(function(item){var key=item.part+'::'+item.title;var group=groupMap.get(key);if(!group){group={part:item.part,title:item.title,lines:[]};groupMap.set(key,group);G.push(group);}if(item.part==='p2')group.cue=item.question;else group.lines.push({t:item.question,zh:item.zh||''});});
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function matches(item){var needle=KW.toLowerCase().replace(/学校(?:规则|规定)/g,'校规');var aliases=/environmental protection/i.test(item.title)?'环保法规':'';return !needle||[item.title,item.question,item.zh,item.idea,aliases,JSON.stringify(item.points||[]),JSON.stringify(item.expressions)].join(' ').toLowerCase().includes(needle);}
function renderBrowse(){var out='',count=0;G.forEach(function(g){if(PART!=='all'&&PART!==g.part)return;var relevant=materials.filter(function(m){return m.part===g.part&&m.title===g.title&&matches(m);});if(!relevant.length)return;out+='<div class="cat">'+(g.part==='p2'?'Part 2 · 题卡':'Part 3 · 讨论问题')+'</div><article class="card"><div class="ptitle">'+esc(g.title)+'</div>';if(g.part==='p2'){out+='<div class="cue">'+esc(g.cue)+'</div>';count++;}else relevant.forEach(function(item){out+='<div class="qrow"><div class="qtxt">'+esc(item.question)+(item.zh?'<div class="zhs">'+esc(item.zh)+'</div>':'')+'</div></div>';count++;});out+='</article>';});document.getElementById('list').innerHTML=out||'<div class="empty">没有匹配的素材，试试更短的关键词。</div>';document.getElementById('cnt').textContent='显示 '+count+' 道题';}
document.getElementById('q').addEventListener('input',function(){KW=this.value.trim();renderBrowse();});document.querySelectorAll('[data-part]').forEach(function(b){b.addEventListener('click',function(){PART=this.dataset.part;document.querySelectorAll('[data-part]').forEach(function(x){var active=x.dataset.part===PART;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active));});renderBrowse();});});
renderBrowse();
</script><script src="question-materials.js?v=20261009b"></script><script src="question-detail-lexis.js?v=20261018"></script></body></html>
