<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>雅思口语 · 音频与逐字稿</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fa;color:#24364a;font:15px/1.65 system-ui,-apple-system,"PingFang SC",sans-serif}
    a{color:#2456a6}
    header{background:#fff;border-bottom:1px solid #dce3ec;padding:20px 18px;position:sticky;top:0;z-index:4}
    header>div,main{max-width:1080px;margin:auto}
    h1{margin:0;font-size:24px;color:#2456a6}
    .subtitle{margin:5px 0 10px;font-size:13px;color:#607188}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
    .links a{font-size:13px;text-decoration:none;padding:5px 10px;border:1px solid #d4deeb;border-radius:18px;background:#f8fafd}
    .control{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:12px;margin-top:12px}
    input{width:100%;padding:10px 12px;border:1px solid #bccad9;border-radius:9px;font:inherit;background:#fff;color:#24364a}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
    .chips button{border:1px solid #c5d1df;border-radius:18px;background:#fff;color:#456078;padding:5px 12px;font:inherit;cursor:pointer}
    .chips button.active{background:#2456a6;border-color:#2456a6;color:#fff}
    main{padding:16px 18px 52px}
    .count{font-size:12px;color:#66788b;margin:12px 0 4px}
    .card{background:#fff;border:1px solid #e1e7ee;border-radius:12px;margin:12px 0;padding:15px}
    .topicTitle{margin:0 0 8px;font-size:17px;color:#2456a6}
    .topicMeta{font-size:12px;color:#7a8899;font-weight:400;margin-left:6px}
    .item{padding:12px 0;border-top:1px solid #edf0f5}
    .item:first-child{border-top:0;padding-top:0}
    .question{font-size:14px;line-height:1.55;color:#3e4d60}
    .part{display:inline-block;font-size:11px;font-weight:700;color:#2456a6;background:#eaf1fb;border-radius:8px;padding:1px 7px;margin-right:6px}
    .zh{font-size:12px;color:#7a8899;margin:3px 0 8px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
    .play{border:0;border-radius:8px;padding:7px 11px;background:#2456a6;color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
    .play.ghost{background:#eef3fb;color:#2456a6}
    .play:disabled{opacity:.45;cursor:default}
    details{margin-top:7px}
    summary{cursor:pointer;font-size:12px;color:#2456a6}
    .transcript{margin-top:6px;padding:9px 10px;border-radius:8px;background:#f7f9fc;color:#445;white-space:pre-wrap;font-size:13px;line-height:1.65}
    .modelBox{margin-top:7px;padding:9px 10px;border-radius:8px;background:#fff8e6;border:1px solid #f0d99d;color:#74582f;white-space:pre-wrap;font-size:13px;line-height:1.65}
    .empty{padding:32px;text-align:center;color:#66788b}
    @media(max-width:600px){header{padding:16px 14px}main{padding:10px 12px 40px}.card{padding:12px}}
  </style>
</head>
<body>
  <header>
    <div>
      <h1>雅思口语 · 音频与逐字稿</h1>
      <div class="subtitle">题目音频、题目逐字稿和已有参考回答，按 Part 1 / Part 2 / Part 3 查询</div>
      <nav class="links" aria-label="页面导航">
        <a href="./">返回听音练习</a>
        <a href="materials.html">逐题扣题素材</a>
        <a href="expressions.html">常用表达库</a>
      </nav>
      <div class="control">
        <label for="q">搜索题目、话题或逐字稿</label>
        <input id="q" type="search" placeholder="例如 advertisement / environment / 环保 / favourite subject">
        <div class="chips" id="partChips" aria-label="题型筛选">
          <button class="active" data-part="all">全部题型</button>
          <button data-part="p1">Part 1</button>
          <button data-part="p2">Part 2</button>
          <button data-part="p3">Part 3</button>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="count" id="count" role="status">正在载入音频索引…</div>
    <div id="list"></div>
  </main>
  <script src="speaking-audio-transcripts.js?v=20261020"></script>
  <script>
    (function () {
      'use strict';
      var DATA = window.IELTSSpeakingAudioTranscripts || [];
      var state = {part: 'all', kw: ''};

      function esc(s) {
        return String(s || '').replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }
      function matches(item) {
        var q = state.kw.trim().toLowerCase();
        return !q || [item.part, item.title, item.question, item.zh, item.model].join(' ').toLowerCase().indexOf(q) >= 0;
      }
      function filtered() {
        return DATA.filter(function (item) {
          return matches(item) && (state.part === 'all' || item.part === state.part);
        });
      }
      function itemHtml(item) {
        var audio = item.audio
          ? '<button class="play" data-audio="' + esc(item.audio) + '">🔊 听题目音频</button>'
          : '<button class="play" disabled>暂无题目音频</button>';
        var modelAudio = item.modelAudio
          ? '<button class="play ghost" data-audio="' + esc(item.modelAudio) + '">🔊 听范例回答</button>'
          : '';
        var transcript = '<details><summary>题目逐字稿</summary><div class="transcript">'
          + esc(item.transcript || item.question) + '</div></details>';
        var model = item.model
          ? '<details><summary>参考回答逐字稿</summary><div class="modelBox">' + esc(item.model) + '</div></details>'
          : '';
        return '<article class="item"><div class="question"><span class="part">'
          + item.part.toUpperCase() + '</span>' + esc(item.question) + '</div>'
          + (item.zh ? '<div class="zh">' + esc(item.zh) + '</div>' : '')
          + '<div class="actions">' + audio + modelAudio + '</div>' + transcript + model + '</article>';
      }
      function render() {
        var items = filtered(), groups = [], map = new Map();
        items.forEach(function (item) {
          var key = item.part + '|' + item.title;
          if (!map.has(key)) { map.set(key, []); groups.push({part:item.part, title:item.title, items:map.get(key)}); }
          map.get(key).push(item);
        });
        document.getElementById('list').innerHTML = groups.map(function (group) {
          return '<section class="card"><h2 class="topicTitle">' + esc(group.title)
            + '<span class="topicMeta">' + group.part.toUpperCase() + ' · ' + group.items.length + ' 条</span></h2>'
            + group.items.map(itemHtml).join('') + '</section>';
        }).join('') || '<div class="empty">没有匹配的内容，试试更短的关键词。</div>';
        document.getElementById('count').textContent = '显示 ' + items.length + ' 条题目音频记录';
      }
      document.getElementById('q').addEventListener('input', function () { state.kw = this.value; render(); });
      document.getElementById('partChips').addEventListener('click', function (e) {
        if (e.target.tagName !== 'BUTTON') return;
        state.part = e.target.dataset.part;
        this.querySelectorAll('button').forEach(function (b) { b.classList.toggle('active', b === e.target); });
        render();
      });
      document.getElementById('list').addEventListener('click', function (e) {
        var button = e.target.closest('[data-audio]');
        if (!button) return;
        new Audio(button.dataset.audio).play().catch(function () {
          button.textContent = '播放失败';
        });
      });
      render();
    })();
  </script>
</body>
</html>
